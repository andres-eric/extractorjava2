services:
  app:
    build: .
    image: sql-extractor:latest
    container_name: sql-extractor
    ports:
      - "8085:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sarasvati;databaseName=MAXCELSASA;encrypt=false;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=tu_usuario
      - SPRING_DATASOURCE_PASSWORD=tu_contraseña
    # Si 'sarasvati' es la máquina local (Windows host), descomenta las líneas siguientes
    # extra_hosts:
    #   - "sarasvati:192.168.6.51"
